Название: Публиковать футбольные новости

на:
  расписание:
    - cron: '*/30 * * * *' # каждые 30 мин (UTC)
  workflow_dispatch:

разрешения:
  содержимое: написать

параллельное выполнение:
  группа: публикация
  cancel-in-progress: false

вакансии:
  публиковать:
    runs-on: ubuntu-latest
    шаги:
      - использует: actions/checkout@v4
        с:
          fetch-depth: 0

      - использует: actions/setup-python@v5
        с:
          python-version: '3.12'
          кэш: pip

      - выполнить: pip install -r requirements.txt

      - имя: Опубликовать
        окружающая среда:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: '@zafootball_news'
          SECOND_FEED: 'https://www.sports.ru/rss/news.xml'
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        выполнить: python publish_once.py

      - имя: Сохранить состояние
        если: всегда()
        выполнить: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f published.json ] || exit 0
          git fetch origin
          git checkout "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add published.json
          git diff --cached --quiet || git commit -m "Update published.json [skip ci]"
          git push origin "${GITHUB_REF_NAME}"
