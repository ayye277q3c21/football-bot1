Название: Публиковать футбольные новости

на:
  расписание:
    - cron: '*/30 * * * *' # каждые 30 мин (UTC)
  workflow_dispatch:

разрешения:
  содержимое: написать

параллельное выполнение:
  группа: публикация
  cancel-in-progress: false

вакансии:
  публиковать:
    runs-on: ubuntu-latest
    шаги:
      - использует: actions/checkout@v4
        с:
          fetch-depth: 0

      - использует: actions/setup-python@v5
        с:
          python-version: '3.12'
          кэш: pip

      - выполнить: pip install -r requirements.txt

      - имя: Опубликовать
        окружающая среда:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: '@zafootball_news'
          SECOND_FEED: 'https://www.sports.ru/rss/news.xml'
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        выполнить: python publish_once.py

      - имя: Безопасное сохранение состояния
        если: всегда()
        оболочка: bash
        выполнить: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Сохраните состояние, полученное в результате этого запуска, а затем объедините его с последним удаленным состоянием.
          cp published.json /tmp/local-published.json 2>/dev/null || echo '[]' > /tmp/local-published.json
          git fetch origin main
          git checkout -B main origin/main
          git show origin/main:published.json > /tmp/remote-published.json 2>/dev/null || echo '[]' > /tmp/remote-published.json

          python - <<'PY'
          импорт json
          from pathlib import Path
          def read(path):
              пытаться:
                  value = json.loads(Path(path).read_text())
                  возвращаем значение, если isinstance(value, list) иначе []
              за исключением исключения:
                  возвращаться []
          merged = list(dict.fromkeys(read('/tmp/remote-published.json') + read('/tmp/local-published.json')))
          Path('published.json').write_text(json.dumps(merged[-3000:], ensure_ascii=False), encoding='utf-8')
          PY

          git add published.json
          if git diff --cached --quiet; then
            echo 'Никаких изменений в состоянии дел'
          еще
            git commit -m "Обновить published.json [пропустить ci]"
            git push origin HEAD:main
          фи

  оповещение при сбое:
    если: failure()
    потребности: опубликовать
    runs-on: ubuntu-latest
    шаги:
      - использует: actions/checkout@v4
      - использует: actions/setup-python@v5
        с:
          python-version: '3.12'
      - имя: Отправить оповещение в Telegram
        окружающая среда:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        выполнить: python notify_failure.py
