name: Publish football news

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (UTC)
  workflow_dispatch:

permissions:
  contents: write   # needed to commit published.json back

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: '@zafootball_news'
          # TOPICS: 'rpl,epl,laliga,seriea,bundesliga,ligue1,eurocups,national,transfers,stars'
        run: python publish_once.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f published.json ] || exit 0
          git add published.json
          git diff --cached --quiet || git commit -m "Update published.json [skip ci]"
          git pull --rebase --autostash || true
          git push
